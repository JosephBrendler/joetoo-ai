#!/bin/bash
# Configuration for joetoo-kwin-plan (trusted Bash, sourced by the planner)
# Sample display dimensions; adjust for the screen being arranged.
screen_width=1920
screen_height=1080
desktop_limit=20

# Desktop | program | session mode | target/argument
# One record is one *intended* window, regardless of network availability.
# Order within each desktop determines its numbered slot.
desktop_session_list=(
    "1|konsole|swr|nuthuvia"
    "1|vncviewer|via-ssh|nuthuvia"
    "2|konsole|swr|Elrond"
    "2|konsole|swr|Elrond"
    "3|konsole|local|btop"
)
