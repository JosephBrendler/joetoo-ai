#
# Trusted joetoo-kwin Bash configuration sample.
# Install/select via /etc/joetoo-kwin/joetoo-kwin.conf (eselect selection is later).
screen_width=1920
screen_height=1080
desktop_limit=20

# Share 87% of screen width among 1-3 Konsole windows, with selectable gutters.
# Four Konsole windows use quadrants. Graphical overlap policy remains provisional.
terminal_width_percent=87
terminal_gap_percent=2
terminal_height_percent=85

desktop_session_list=(
    "1|konsole|ssh|nuthuvia"
    "1|vncviewer|via-ssh|nuthuvia"
    "2|konsole|ssh|Elrond"
    "2|konsole|ssh|Elrond"
    "3|konsole|local|btop"
)
