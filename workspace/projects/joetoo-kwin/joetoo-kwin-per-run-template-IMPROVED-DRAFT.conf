# DRAFT DESIGN EXAMPLE ONLY -- not the current installed configuration template.
# Trusted Bash configuration for one configured joetoo-kwin run.
# Current loader requires this file to be chosen via -f or found in its
# currently accepted XDG path. Any proposed multi-layer defaults are NOT yet
# automatically loaded. Do not use this draft to infer a new search path.

# Required until display size is discovered by an accepted implementation.
screen_width=1920
screen_height=1080
# example configurable overrides - see /etc/joetoo-kwin/defaults.conf for complete list
desktop_limit=20
rdp_windowing_backend=wayland

# Format: DESKTOP|PROGRAM|MODE|TARGET[|LAYER]
# Layers: under, panel, over. No credentials in targets.
# Replace/remove these illustrative local recipes as appropriate.
desktop_session_list=(
    '3|dolphin|local||under'
    '3|konsole|local|btop|panel'
)

