# DRAFT DESIGN EXAMPLE ONLY -- not the current installed configuration template.
# Trusted Bash configuration for one configured joetoo-kwin run.
# Current loader requires this file to be chosen via -f or found in its
# currently accepted XDG path. Any proposed multi-layer defaults are NOT yet
# automatically loaded. Do not use this draft to infer a new search path.
#
# Stage 4 design intent (NOT current loader behavior): optional system-wide
# and per-user defaults supply a baseline; this selected per-run file may
# override ANY exposed, validated application parameter. -f FILE selects a
# different per-run file with the same overriding authority as this default.
# A future user-owned profile-selection symlink may point to this kind of file.

# Required until display size is discovered by an accepted implementation.
screen_width=1920
screen_height=1080
# Example optional per-run overrides. A future separately installed, annotated
# settings reference will document all supported names, defaults and limits;
# /etc/joetoo-kwin/defaults.conf need not contain that complete reference.
desktop_limit=20
# rdp_windowing_backend=wayland  # Enable only on an appropriate local host.

# Format: DESKTOP|PROGRAM|MODE|TARGET[|LAYER]
# Layers: under, panel, over. No credentials in targets.
# Replace/remove these illustrative local recipes as appropriate.
desktop_session_list=(
    '3|dolphin|local||under'
    '3|konsole|local|btop|panel'
)

# Examples of supported launch recipes (illustrative; not enabled).
# For authoritative contracts, see the installed project documentation when
# packaged, or ARCHITECTURE.md in the development repository.
