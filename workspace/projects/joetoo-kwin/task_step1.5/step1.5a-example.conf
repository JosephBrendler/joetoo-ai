# Trusted Bash configuration for candidate -c review, not an installed config.
# Explicit usable display dimensions; these are example values, not detection.
screen_width=1920
screen_height=1080

# Omitted geometry settings retain planner defaults (87% total width, 2% gap).
# Each entry is desktop|program-basename|mode|target. Targets are not contacted.
# Four terminals on one desktop use two rows; five are rejected.
desktop_session_list=(
    '1|konsole|ssh|unreachable.invalid'
    '1|vncviewer|via-ssh|unreachable.invalid'
    '1|konsole|local|btop'
    '2|konsole|direct|'
)
