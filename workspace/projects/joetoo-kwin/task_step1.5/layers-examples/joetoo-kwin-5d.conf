# Trusted executable Bash: edit a COPY, then inspect with joetoo-kwin -c -f FILE.
# Confirmed launch: joetoo-kwin -o -f FILE. No files are copied into HOME automatically.
# Loader: built-ins -> optional system/user defaults.conf -> this plan -> CLI overrides.
# Optional settings and packaging paths: docs/configuration-reference.md in the checkout,
# or configuration-reference.md under Gentoo's /usr/share/doc/<package-version>/.

# Required: supply the intended local display size; no automatic discovery.
screen_width=1920
screen_height=1080

# Any exposed setting may be overridden here, subject to validation.
# rdp_windowing_backend=wayland  # Only on an appropriate native local backend.
rdp_security_protocol=nla     # nla -> /sec:nla; negotiate -> no /sec: argument.
rdp_certificate_policy=strict # strict -> /cert:deny; prompt -> no /cert: argument.

# DESKTOP|PROGRAM|MODE|TARGET[|LAYER]; layers: under, panel, over.
# Slots are derived from entry order on each desktop, never another field.
desktop_session_list=(
    '11|dolphin|local||under'
    '11|konsole|local|btop|panel'
)

# Optional recipes: uncomment INSIDE the array above, after adapting endpoints.
# '3|dolphin|local|Documents|panel'
# '3|dolphin|sftp|sftp://user@files.example/home/user/|panel'
# '3|konsole|ssh|user@host.example|panel'
# '4|vncviewer|ssh|ssh://user@vnc.example/display/2|panel'
# '4|sdl-freerdp|rdp|rdp://user@rdp.example:3389|panel'
# No passwords or arbitrary client switches in targets. Remote login is separate
# from local viewer registration/placement. Replace example endpoints before -o.
# End of configuration
