# Trusted Bash configuration template. Copy manually to:
# ${XDG_CONFIG_HOME:-$HOME/.config}/joetoo-kwin/joetoo-kwin.conf
# Relative XDG_CONFIG_HOME is ignored; explicit -f selects exactly that file.
# No automatic user-file creation/migration is performed by the CLI.
screen_width=1920
screen_height=1080
desktop_limit=20
dt_win_limit=4
min_window_exposure_px=32
# One activation request; bounded observation only, within the existing lease.
# Milliseconds: timeout 1..2000; watchdog interval 1..250 and <= timeout.
initial_focus_timeout_ms=500
initial_focus_poll_interval_ms=25
# Offline SFTP capability-tool budget (milliseconds, 1..10000); no network probe.
sftp_capability_timeout_ms=2000
# Optional post-confirmation NSS + TCP advisory. Set $FALSE to disable both.
# Each stage has this timeout (ms, 1..10000); numeric IPs skip NSS resolution.
sftp_advisory_enabled=$TRUE
sftp_advisory_timeout_ms=2000
# Fallback TCP probe port (1..65535); an explicit URL port takes precedence here.
# KIO/libssh configuration may select a different endpoint/port. TCP is not SSH proof.
sftp_advisory_ssh_port=22
# TigerVNC over dedicated SSH (all time values are milliseconds).
# SSH startup: 100..120000; viewer readiness: 1000..3600000; polling: 10..1000.
# Cleanup: 100..30000; attempts: 1..20; identity event bound: 16..4096.
# Identity settle: 10..2000 and < readiness; D-Bus: 100..30000.
# Placement: 100..15000, within the existing broker geometry lease.
# SSH key/agent + independently verified known-host entry required; BatchMode.
# Viewer readiness includes interactive VNC authentication; no 15-second limit.
vnc_ssh_start_timeout_ms=10000
vnc_viewer_ready_timeout_ms=120000
vnc_supervisor_poll_interval_ms=100
vnc_cleanup_timeout_ms=2000
vnc_local_port_attempts=3
vnc_identity_event_limit=256
vnc_identity_settle_ms=500
vnc_dbus_timeout_ms=3000
# Placement observation cannot exceed the existing broker geometry lease (15s).
vnc_placement_timeout_ms=15000
# Observer startup: 100..10000 ms and strictly below vnc_dbus_timeout_ms.
vnc_identity_start_timeout_ms=1000
# Optional recipe: '4|vncviewer|ssh|ssh://joe@host/display/2|panel'
# Alternative explicit VNC port: ssh://joe@host:2222/port/5902
# Both SSH-forward endpoints are loopback-only; no raw remote VNC connection.
# Four fields (or a blank fifth) mean implicit panel for EVERY application.
# Explicit panel/under/over entries bypass the implicit budget but still require
# valid geometry. The panel allocator supports at most four panel participants.
# Desktops execute in first-appearance order; entries retain desktop-local order.
# Dolphin relative paths resolve from HOME, not the config location.
# Replace illustrative SSH hosts. Optional SFTP recipe (not enabled here):
# '4|dolphin|sftp|sftp://joe@files.example/home/joe/|panel'
# Absent URI path requests the remote login directory; / requests remote root.
# Percent-encode spaces/UTF-8. No passwords/query/fragment; KIO owns authentication.
# Independently verify new fingerprints; cancel unexpected changed-key warnings.
# URI/profile precedence follows KIO/libssh, not guaranteed OpenSSH semantics.
desktop_session_list=(
    '4|dolphin|local||panel'
    '4|konsole|ssh|example.invalid|panel'
    '4|konsole|ssh|example.invalid|over'
    '2|konsole|local|btop|'
    '4|dolphin|local||under'
)
# Panel/graphical regions and gutters can be overridden using existing settings:
terminal_width_percent=87
terminal_gap_percent=2
terminal_height_percent=85
terminal_left_percent=1
terminal_top_percent=5
terminal_row_gap_percent=3
graphical_left_percent=5
graphical_top_percent=3
graphical_width_percent=94
graphical_height_percent=90
# Initial order is under -> panel -> over, file order inside each layer.
# Preferred focus: last successful over, else last successful panel, never under.
# It is applied only on the currently displayed desktop, with no desktop switch.
# Exposure predictions concern frame rectangles, not compositor hit-test proof.
